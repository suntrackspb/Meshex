name: build

# Сборка: по тегу v* (релиз) и вручную (Actions → build → Run workflow).
# На каждый пуш в main не собираем — прогоны копились в очереди.
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Платформа для тестовой сборки'
        type: choice
        required: true
        default: android
        options: [android, windows, linux, macos, ios, all]
      version:
        description: 'Версия приложения, например v0.1.13.beta или 0.1.14-beta.1'
        type: string
        required: true

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Select platforms and validate version
        id: select
        env:
          EVENT: ${{ github.event_name }}
          PLATFORM: ${{ inputs.platform }}
          VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PYTHON'
          import json, os, re
          # Linux stays on Ubuntu 22.04 for compatibility with older glibc.
          platforms = [
              {
                  "platform": "android",
                  "os": "ubuntu-latest",
                  "cmd": "flutter build apk --release",
                  "out": "build/app/outputs/flutter-apk/app-release.apk"
              },
              {
                  "platform": "linux",
                  "os": "ubuntu-22.04",
                  "cmd": "flutter build linux --release",
                  "out": "build/linux/x64/release/bundle"
              },
              {
                  "platform": "windows",
                  "os": "windows-latest",
                  "cmd": "flutter build windows --release",
                  "out": "build/windows/x64/runner/Release"
              },
              {
                  "platform": "macos",
                  "os": "macos-latest",
                  "cmd": "flutter build macos --release",
                  "out": "build/macos/Build/Products/Release/*.app"
              },
              {
                  "platform": "ios",
                  "os": "macos-latest",
                  "cmd": "flutter build ios --release --no-codesign",
                  "out": "build/ios/iphoneos/Runner.app"
              }
          ]
          if os.environ['EVENT'] == 'workflow_dispatch':
              version = os.environ['VERSION'].removeprefix('v')
              if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+(?:[-.][0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?', version):
                  raise SystemExit('Invalid version: expected v0.1.13.beta or 0.1.14-beta.1')
              platform = os.environ['PLATFORM']
              if platform != 'all':
                  platforms = [item for item in platforms if item['platform'] == platform]
              if not platforms:
                  raise SystemExit('Unknown platform')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('matrix=' + json.dumps({'include': platforms}), file=output)
          PYTHON

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config libsecret-1-dev libnotify-dev libayatana-appindicator3-dev

      # libserialport (USB Serial) собирается из исходников через autotools.
      - name: Install autotools (macOS)
        if: matrix.platform == 'macos'
        run: brew install automake libtool

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Подпись APK постоянным ключом: секреты ANDROID_KEYSTORE_BASE64 (jks в
      # base64), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS. Без ключа
      # каждая сборка подписана своим отладочным и не ставится поверх
      # прежней — поэтому тег и ручную сборку без ключа не собираем.
      - name: Android signing key
        if: matrix.platform == 'android'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [[ "$GITHUB_REF" == refs/tags/v* || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
              echo "::error::нет секрета ANDROID_KEYSTORE_BASE64 — релизный APK не подписать"
              exit 1
            fi
            echo "::warning::нет ключа — APK с отладочной подписью"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Generate platform folder
        shell: bash
        run: |
          flutter create . --platforms=${{ matrix.platform }} \
            --project-name meshex --org ru.meshex
          rm -f test/widget_test.dart
          python3 tool/patch_platforms.py || python tool/patch_platforms.py
          if [ -f flutter_launcher_icons.yaml ]; then dart run flutter_launcher_icons; fi

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - name: Set build version
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            version="${REQUESTED_VERSION#v}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          # Apple bundle versions accept only the numeric X.Y.Z part.
          case "${{ matrix.platform }}" in
            ios|macos) version="$(echo "$version" | cut -d. -f1-3 | cut -d- -f1)" ;;
          esac
          echo "VERSION_ARGS=--build-name=$version --build-number=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      # CARTO_KEY — тёмная подложка карты; пусто — только OSM.
      - name: Build
        shell: bash
        env:
          CARTO_KEY: ${{ vars.CARTO_KEY }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          defines=(
            --dart-define=RELEASES_REPO="$GITHUB_REPOSITORY"
            --dart-define=CARTO_KEY="$CARTO_KEY"
          )
          ${{ matrix.cmd }} $VERSION_ARGS "${defines[@]}"
          # Android: основной APK только arm64 (~30 МБ), универсальный — для x86
          # (эмуляторы, хромбуки). Сборки пишут в один файл — универсальный убираем.
          if [ "${{ matrix.platform }}" = android ]; then
            mkdir -p dist
            cp ${{ matrix.out }} dist/meshex-android-universal.apk
            ${{ matrix.cmd }} --target-platform android-arm64 $VERSION_ARGS "${defines[@]}"
          fi

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          name=meshex-${{ matrix.platform }}
          case "${{ matrix.platform }}" in
            android) cp ${{ matrix.out }} dist/$name.apk ;;
            ios)
              # Неподписанный .ipa — Sideloadly подпишет своим Apple ID.
              mkdir -p Payload && cp -R ${{ matrix.out }} Payload/
              zip -qry dist/$name.ipa Payload ;;
            macos) (cd "$(dirname ${{ matrix.out }})" && zip -qry "$GITHUB_WORKSPACE/dist/$name.zip" *.app) ;;
            windows) pwsh -c "Compress-Archive -Path '${{ matrix.out }}/*' -DestinationPath dist/$name.zip" ;;
            linux) tar -czf dist/$name.tar.gz -C ${{ matrix.out }} . ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: meshex-${{ matrix.platform }}${{ github.event_name == 'workflow_dispatch' && format('-{0}', inputs.version) || '' }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('prototype-{0}', github.run_number) }}
          name: Meshex ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('#{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          files: dist/*
