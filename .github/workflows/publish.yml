name: publish

# FTP_ROOT — папка downloads относительно корня FTP-аккаунта.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег опубликованного релиза (v0.1.13)'
        required: true

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASES_ROOT: ${{ github.workspace }}/.release-downloads
      RELEASES_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and verify release
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: python tools/fetch_release.py "$TAG"
      - name: Publish over FTP
        env:
          FTP_HOST: ${{ vars.FTP_HOST || '83.222.14.199' }}
          FTP_USER: ${{ vars.FTP_USER || 'cl482017_github' }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_ROOT: ${{ vars.FTP_ROOT || '/' }}
          FTP_PORT: ${{ vars.FTP_PORT || '21' }}
          FTP_TLS: ${{ vars.FTP_TLS || 'false' }}
        run: python tools/upload_release_ftp.py
